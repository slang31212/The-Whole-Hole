name: Deploy to GitHub Pages

# Publishes the repository as a static site on GitHub Pages.
# The Seaways MPSS site is served at the root and the SoCal Fishing
# dashboard at /socal-fishing/.

on:
  push:
    branches:
      - main
      - claude/marine-chartplotter-fishing-950yt2
  workflow_dispatch:

# Permissions the deploy job needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically the first time this runs
          # (requires GitHub Actions to be an allowed Pages source).
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
